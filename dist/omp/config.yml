# Generated by scripts/build.py from rules/*.toml. Do not edit by hand.
# https://github.com/josipledic/never-ask-again
#
# bash.patterns is first-match-wins, so this file is ordered
# deny -> prompt -> allow, ending in a catch-all prompt.

tools:
  approvalMode: write
  approval:
    bash: prompt

bash:
  patterns:
    # Core: deny
    # Privilege escalation. Nothing an agent does should need root.
    - match: "sudo *"
      approval: deny
    - match: "doas *"
      approval: deny
    - match: "su *"
      approval: deny
    # Recursive or raw deletion with no undo.
    - match: "rm -rf *"
      approval: deny
    - match: "rm -fr *"
      approval: deny
    - match: "rm -r *"
      approval: deny
    - match: "rmdir *"
      approval: deny
    - match: "shred *"
      approval: deny
    # Writes raw blocks or repartitions disks.
    - match: "dd *"
      approval: deny
    - match: "mkfs *"
      approval: deny
    - match: "diskutil *"
      approval: deny
    - match: "fdisk *"
      approval: deny
    # Changes ownership or opens permissions across a tree.
    - match: "chown *"
      approval: deny
    - match: "chmod 777 *"
      approval: deny
    - match: "chmod -R *"
      approval: deny
    # Arbitrary network I/O is the exfiltration path. Use the fetch tool, which is logged.
    - match: "curl *"
      approval: deny
    - match: "wget *"
      approval: deny
    - match: "nc *"
      approval: deny
    - match: "ncat *"
      approval: deny
    - match: "socat *"
      approval: deny
    # Moves data or executes on other machines, outside anything this policy can see.
    - match: "ssh *"
      approval: deny
    - match: "scp *"
      approval: deny
    - match: "rsync *"
      approval: deny
    - match: "sftp *"
      approval: deny
    - match: "ssh-keygen *"
      approval: deny
    - match: "ssh-add *"
      approval: deny
    # Credential stores. Reading one is the same as leaking it.
    - match: "gpg *"
      approval: deny
    - match: "pass *"
      approval: deny
    - match: "security *"
      approval: deny
    - match: "keychain *"
      approval: deny
    - match: "op *"
      approval: deny
    - match: "vault *"
      approval: deny
    # Executes a constructed string, which defeats every rule above it.
    - match: "eval *"
      approval: deny
    - match: "exec *"
      approval: deny
    - match: "source *"
      approval: deny
    - match: "bash -c *"
      approval: deny
    - match: "sh -c *"
      approval: deny
    - match: "zsh -c *"
      approval: deny
    - match: "osascript *"
      approval: deny
    # Starts, stops or schedules background work that outlives the session.
    - match: "launchctl *"
      approval: deny
    - match: "systemctl *"
      approval: deny
    - match: "service *"
      approval: deny
    - match: "crontab *"
      approval: deny
    - match: "at *"
      approval: deny
    # Kills processes the agent did not start, or takes the machine down.
    - match: "kill -9 *"
      approval: deny
    - match: "killall *"
      approval: deny
    - match: "pkill *"
      approval: deny
    - match: "shutdown *"
      approval: deny
    - match: "reboot *"
      approval: deny
    # Rewrites macOS defaults for other applications.
    - match: "defaults write *"
      approval: deny
    # find running a command per match is an arbitrary execution primitive.
    - match: "find * -delete *"
      approval: deny
    - match: "find * -exec *"
      approval: deny
    - match: "xargs rm *"
      approval: deny
    # Covers the agent's tracks.
    - match: "history -c"
      approval: deny
    # A nested agent starts with its own permission set, not this one.
    - match: "claude *"
      approval: deny
    - match: "codex *"
      approval: deny
    - match: "opencode *"
      approval: deny
    - match: "omp *"
      approval: deny
    - match: "droid *"
      approval: deny
    - match: "cursor-agent *"
      approval: deny
    # Version control: deny
    # Rewrites shared history. Run --force-with-lease yourself if you mean it.
    - match: "git push --force *"
      approval: deny
    - match: "git push -f *"
      approval: deny
    - match: "git push --mirror *"
      approval: deny
    - match: "git push --delete *"
      approval: deny
    # Destroys uncommitted work. There is no reflog for something never committed.
    - match: "git reset --hard *"
      approval: deny
    - match: "git clean -f *"
      approval: deny
    - match: "git clean -x *"
      approval: deny
    - match: "git checkout -- *"
      approval: deny
    - match: "git restore *"
      approval: deny
    # Rewrites or prunes history beyond recovery.
    - match: "git filter-branch *"
      approval: deny
    - match: "git filter-repo *"
      approval: deny
    - match: "git reflog delete *"
      approval: deny
    - match: "git gc --prune *"
      approval: deny
    - match: "git update-ref -d *"
      approval: deny
    - match: "git branch -D *"
      approval: deny
    # Changes git behaviour outside this repository, or redirects git to another binary.
    - match: "git config --global *"
      approval: deny
    - match: "git config --system *"
      approval: deny
    - match: "git *--exec-path*"
      approval: deny
    # JVM and build systems: deny
    # Wipes the entire Bazel output base, including caches that take hours to rebuild.
    - match: "bazel clean --expunge *"
      approval: deny
    # Containers: deny
    # Prunes shared local state. Named volumes hold databases you cannot rebuild.
    - match: "docker system prune *"
      approval: deny
    - match: "docker volume prune *"
      approval: deny
    - match: "docker volume rm *"
      approval: deny
    - match: "docker image prune *"
      approval: deny
    - match: "docker builder prune *"
      approval: deny
    - match: "docker network rm *"
      approval: deny
    - match: "podman system prune *"
      approval: deny
    # Writes registry credentials to the Docker config file.
    - match: "docker login *"
      approval: deny
    # Kubernetes: deny
    # Mutating verbs against a live cluster. There is no local undo for any of them.
    - match: "kubectl delete *"
      approval: deny
    - match: "kubectl apply *"
      approval: deny
    - match: "kubectl replace *"
      approval: deny
    - match: "kubectl patch *"
      approval: deny
    - match: "kubectl edit *"
      approval: deny
    - match: "kubectl scale *"
      approval: deny
    - match: "kubectl drain *"
      approval: deny
    - match: "kubectl cordon *"
      approval: deny
    - match: "kubectl taint *"
      approval: deny
    - match: "kubectl create *"
      approval: deny
    - match: "kubectl rollout undo *"
      approval: deny
    # A shell in a pod is a shell, with that pod's service account and network position.
    - match: "kubectl exec *"
      approval: deny
    - match: "kubectl attach *"
      approval: deny
    # Silently repoints every later command at a different cluster.
    - match: "kubectl config use-context *"
      approval: deny
    - match: "kubectl config set *"
      approval: deny
    # Installs, removes or rolls back releases and controllers.
    - match: "helm install *"
      approval: deny
    - match: "helm uninstall *"
      approval: deny
    - match: "helm rollback *"
      approval: deny
    - match: "helm delete *"
      approval: deny
    - match: "argocd app delete *"
      approval: deny
    - match: "argocd app rollback *"
      approval: deny
    - match: "flux suspend *"
      approval: deny
    - match: "flux uninstall *"
      approval: deny
    - match: "istioctl uninstall *"
      approval: deny
    # Cloud CLIs: deny
    # AWS mutating verbs. Creating, updating or deleting cloud resources costs money and has no undo.
    - match: "aws * delete* *"
      approval: deny
    - match: "aws * terminate* *"
      approval: deny
    - match: "aws * remove* *"
      approval: deny
    - match: "aws * put* *"
      approval: deny
    - match: "aws * create* *"
      approval: deny
    - match: "aws * update* *"
      approval: deny
    - match: "aws s3 rm *"
      approval: deny
    - match: "aws s3 rb *"
      approval: deny
    - match: "aws s3 sync *"
      approval: deny
    - match: "aws s3 mv *"
      approval: deny
    # Identity and access changes are never delegated. Neither is rewriting your local credential state.
    - match: "aws iam *"
      approval: deny
    - match: "aws sts assume-role *"
      approval: deny
    - match: "aws configure set *"
      approval: deny
    - match: "gcloud iam *"
      approval: deny
    - match: "gcloud auth *"
      approval: deny
    - match: "az role *"
      approval: deny
    - match: "az login *"
      approval: deny
    - match: "ibmcloud iam *"
      approval: deny
    - match: "ibmcloud login *"
      approval: deny
    # Google Cloud, Azure and IBM Cloud mutating verbs.
    - match: "gcloud * delete *"
      approval: deny
    - match: "gcloud * create *"
      approval: deny
    - match: "gcloud * update *"
      approval: deny
    - match: "gsutil rm *"
      approval: deny
    - match: "gsutil rsync *"
      approval: deny
    - match: "az * delete *"
      approval: deny
    - match: "az * create *"
      approval: deny
    - match: "az * update *"
      approval: deny
    - match: "ibmcloud * delete *"
      approval: deny
    - match: "ibmcloud * create *"
      approval: deny
    - match: "ibmcloud * update *"
      approval: deny
    # Infrastructure as code: deny
    # Applies or destroys real infrastructure.
    - match: "terraform apply *"
      approval: deny
    - match: "terraform destroy *"
      approval: deny
    - match: "tofu apply *"
      approval: deny
    - match: "tofu destroy *"
      approval: deny
    - match: "terragrunt apply *"
      approval: deny
    - match: "terragrunt destroy *"
      approval: deny
    - match: "terragrunt run-all *"
      approval: deny
    - match: "pulumi destroy *"
      approval: deny
    - match: "cdk destroy *"
      approval: deny
    - match: "cdk bootstrap *"
      approval: deny
    - match: "sam deploy *"
      approval: deny
    - match: "serverless deploy *"
      approval: deny
    - match: "serverless remove *"
      approval: deny
    - match: "ansible-playbook *"
      approval: deny
    # Corrupts or discards Terraform state. Worse than a bad apply, because the recovery path runs through the state file you just broke.
    - match: "terraform state rm *"
      approval: deny
    - match: "terraform state mv *"
      approval: deny
    - match: "terraform state push *"
      approval: deny
    - match: "terraform force-unlock *"
      approval: deny
    - match: "terraform taint *"
      approval: deny
    - match: "terraform workspace delete *"
      approval: deny
    - match: "pulumi stack rm *"
      approval: deny
    # Destroys hosted environments or resets a hosted database.
    - match: "flyctl destroy *"
      approval: deny
    - match: "fly destroy *"
      approval: deny
    - match: "supabase db reset *"
      approval: deny
    - match: "wrangler kv:key delete *"
      approval: deny
    - match: "wrangler r2 object delete *"
      approval: deny
    # Writes production secrets and environment variables, or promotes a build to production.
    - match: "fly secrets *"
      approval: deny
    - match: "vercel env add *"
      approval: deny
    - match: "vercel env rm *"
      approval: deny
    - match: "vercel --prod *"
      approval: deny
    - match: "netlify env:set *"
      approval: deny
    - match: "wrangler secret *"
      approval: deny
    # Databases and migrations: deny
    # Drops, resets or rolls back a schema. The data that was there is gone.
    - match: "prisma migrate reset *"
      approval: deny
    - match: "prisma db execute *"
      approval: deny
    - match: "drizzle-kit drop *"
      approval: deny
    - match: "atlas schema apply *"
      approval: deny
    - match: "goose down *"
      approval: deny
    - match: "goose reset *"
      approval: deny
    - match: "flyway clean *"
      approval: deny
    - match: "flyway migrate *"
      approval: deny
    - match: "liquibase dropAll *"
      approval: deny
    - match: "alembic downgrade *"
      approval: deny
    - match: "dbt run-operation *"
      approval: deny
    # Forges and CI: deny
    # Reads or writes CI secrets and auth tokens. Printing one to the transcript leaks it.
    - match: "gh secret *"
      approval: deny
    - match: "gh variable *"
      approval: deny
    - match: "gh auth *"
      approval: deny
    - match: "glab token *"
      approval: deny
    # Deletes or archives a repository, or publishes a release. None of it is undoable.
    - match: "gh release create *"
      approval: deny
    - match: "gh release delete *"
      approval: deny
    - match: "gh repo delete *"
      approval: deny
    - match: "gh repo archive *"
      approval: deny
    # Raw API calls with a write method bypass every other gh rule above.
    - match: "gh api -X DELETE *"
      approval: deny
    - match: "gh api --method DELETE *"
      approval: deny
    - match: "gh api -X POST *"
      approval: deny
    - match: "gh api --method POST *"
      approval: deny
    - match: "gh api -X PATCH *"
      approval: deny
    - match: "gh api -X PUT *"
      approval: deny
    # Publishing: deny
    # Publishes to a public registry. Once a version number is taken it is taken forever.
    - match: "npm publish *"
      approval: deny
    - match: "pnpm publish *"
      approval: deny
    - match: "yarn npm publish *"
      approval: deny
    - match: "bun publish *"
      approval: deny
    - match: "cargo publish *"
      approval: deny
    - match: "cargo yank *"
      approval: deny
    - match: "twine upload *"
      approval: deny
    - match: "uv publish *"
      approval: deny
    - match: "poetry publish *"
      approval: deny
    - match: "hatch publish *"
      approval: deny
    - match: "mvn deploy *"
      approval: deny
    - match: "gradle publish *"
      approval: deny
    - match: "./gradlew publish *"
      approval: deny
    - match: "dotnet nuget push *"
      approval: deny
    - match: "gem push *"
      approval: deny
    # Core: ask
    # Installs software machine-wide and runs vendor scripts as you.
    - match: "brew *"
      approval: prompt
    - match: "apt *"
      approval: prompt
    - match: "apt-get *"
      approval: prompt
    # Version control: ask
    # Publishes to a shared remote or rewrites a commit others may already have.
    - match: "git push *"
      approval: prompt
    - match: "git commit --amend *"
      approval: prompt
    - match: "git tag -d *"
      approval: prompt
    - match: "git remote add *"
      approval: prompt
    - match: "git submodule update *"
      approval: prompt
    # Node and TypeScript: ask
    # Resolves and installs new code from a registry, then runs its lifecycle scripts as you. That is remote code execution.
    - match: "npm install *"
      approval: prompt
    - match: "pnpm add *"
      approval: prompt
    - match: "yarn add *"
      approval: prompt
    - match: "bun add *"
      approval: prompt
    # Opens a browser session that records whatever you do into a test file.
    - match: "playwright codegen *"
      approval: prompt
    # Go: ask
    # Downloads and builds code from a module proxy, and go install puts a binary on your PATH.
    - match: "go install *"
      approval: prompt
    - match: "go get *"
      approval: prompt
    # Python: ask
    # Resolves and installs new code from an index, then runs its build backend as you. Same class as npm install.
    - match: "pip install *"
      approval: prompt
    - match: "uv add *"
      approval: prompt
    - match: "uv pip install *"
      approval: prompt
    - match: "poetry add *"
      approval: prompt
    # python -c executes an arbitrary program passed as a string, exactly like bash -c. It cannot be allowed while bash -c is denied.
    - match: "python -c *"
      approval: prompt
    # Rust: ask
    # Resolves new crates from the registry and compiles their build scripts, which run as you.
    - match: "cargo add *"
      approval: prompt
    - match: "cargo install *"
      approval: prompt
    # Task runners: ask
    # Downloads and installs a toolchain, running the vendor's install script.
    - match: "mise install *"
      approval: prompt
    - match: "asdf install *"
      approval: prompt
    # Containers: ask
    # Starts a container, which is a process with its own view of the filesystem and network. docker exec is a shell.
    - match: "docker run *"
      approval: prompt
    - match: "docker exec *"
      approval: prompt
    - match: "docker compose up *"
      approval: prompt
    - match: "docker compose down *"
      approval: prompt
    - match: "podman run *"
      approval: prompt
    # Removes containers and images, or pushes one to a registry.
    - match: "docker rm *"
      approval: prompt
    - match: "docker rmi *"
      approval: prompt
    - match: "docker push *"
      approval: prompt
    # Kubernetes: ask
    # Opens a tunnel into the cluster or copies files across the boundary.
    - match: "kubectl port-forward *"
      approval: prompt
    - match: "kubectl cp *"
      approval: prompt
    # Changes what is running, but through a reviewable release or reconciliation.
    - match: "helm upgrade *"
      approval: prompt
    - match: "argocd app sync *"
      approval: prompt
    - match: "flux reconcile *"
      approval: prompt
    # Infrastructure as code: ask
    # Downloads providers and modules from a registry, or reaches out to reconcile remote state.
    - match: "terraform init *"
      approval: prompt
    - match: "terraform import *"
      approval: prompt
    - match: "terraform refresh *"
      approval: prompt
    # Deploys. Reviewable, reversible with effort, but it changes what is running in production.
    - match: "pulumi up *"
      approval: prompt
    - match: "cdk deploy *"
      approval: prompt
    - match: "vercel deploy *"
      approval: prompt
    - match: "netlify deploy *"
      approval: prompt
    - match: "fly deploy *"
      approval: prompt
    - match: "wrangler deploy *"
      approval: prompt
    # Runs SQL against a D1 database. The --local flag makes it safe, but ask is evaluated before allow so the gate has to sit on the whole command.
    - match: "wrangler d1 execute *"
      approval: prompt
    # Databases and migrations: ask
    # Opens an interactive session against a database that may well be production.
    - match: "psql *"
      approval: prompt
    - match: "mysql *"
      approval: prompt
    - match: "mongosh *"
      approval: prompt
    - match: "redis-cli *"
      approval: prompt
    - match: "sqlite3 *"
      approval: prompt
    # Applies a migration forward. Reviewable, but it changes a live schema.
    - match: "alembic upgrade *"
      approval: prompt
    - match: "atlas migrate apply *"
      approval: prompt
    - match: "goose up *"
      approval: prompt
    - match: "prisma migrate dev *"
      approval: prompt
    - match: "prisma db push *"
      approval: prompt
    - match: "drizzle-kit push *"
      approval: prompt
    - match: "dbt run *"
      approval: prompt
    - match: "dbt seed *"
      approval: prompt
    # Forges and CI: ask
    # Creates or resolves something other people will see and get notified about.
    - match: "gh pr create *"
      approval: prompt
    - match: "gh pr merge *"
      approval: prompt
    - match: "gh pr close *"
      approval: prompt
    - match: "gh workflow run *"
      approval: prompt
    - match: "gh run cancel *"
      approval: prompt
    - match: "glab mr create *"
      approval: prompt
    # Runs a workflow locally in a container with your environment.
    - match: "act *"
      approval: prompt
    # CLI utilities: ask
    # Generates real network load, or calls a gRPC service that may be production.
    - match: "k6 run *"
      approval: prompt
    - match: "grpcurl *"
      approval: prompt
    # Version control: allow
    # Local and reversible. Anything these touch is recoverable from the reflog.
    - match: "git add *"
      approval: allow
    - match: "git commit *"
      approval: allow
    - match: "git switch *"
      approval: allow
    - match: "git checkout *"
      approval: allow
    - match: "git branch *"
      approval: allow
    - match: "git fetch *"
      approval: allow
    - match: "git pull --ff-only *"
      approval: allow
    - match: "git stash *"
      approval: allow
    - match: "git worktree *"
      approval: allow
    - match: "git rebase *"
      approval: allow
    - match: "git bisect *"
      approval: allow
    - match: "git notes *"
      approval: allow
    - match: "git merge --abort"
      approval: allow
    - match: "git cherry-pick --abort"
      approval: allow
    - match: "git revert --abort"
      approval: allow
    # Read-only inspection.
    - match: "git blame *"
      approval: allow
    - match: "git describe *"
      approval: allow
    - match: "git rev-parse *"
      approval: allow
    - match: "git ls-files *"
      approval: allow
    - match: "git shortlog *"
      approval: allow
    - match: "git range-diff *"
      approval: allow
    - match: "git lfs ls-files *"
      approval: allow
    - match: "git tag"
      approval: allow
    - match: "git remote -v"
      approval: allow
    - match: "git submodule status"
      approval: allow
    # Jujutsu keeps an operation log, so every one of these is undoable with jj undo.
    - match: "jj log *"
      approval: allow
    - match: "jj diff *"
      approval: allow
    - match: "jj describe *"
      approval: allow
    - match: "jj new *"
      approval: allow
    - match: "jj squash *"
      approval: allow
    - match: "jj rebase *"
      approval: allow
    - match: "jj status"
      approval: allow
    # Runs the hooks the repository already committed to running.
    - match: "gitleaks detect *"
      approval: allow
    - match: "gitleaks protect *"
      approval: allow
    - match: "pre-commit run *"
      approval: allow
    - match: "lefthook run *"
      approval: allow
    - match: "commitlint *"
      approval: allow
    # Node and TypeScript: allow
    # Runs a script the repository already defines. Nothing new is resolved from a registry.
    - match: "npm run *"
      approval: allow
    - match: "npm test *"
      approval: allow
    - match: "pnpm run *"
      approval: allow
    - match: "pnpm test *"
      approval: allow
    - match: "pnpm -r run *"
      approval: allow
    - match: "pnpm -F * run *"
      approval: allow
    - match: "yarn run *"
      approval: allow
    - match: "yarn test *"
      approval: allow
    - match: "bun run *"
      approval: allow
    - match: "bun test *"
      approval: allow
    - match: "deno task *"
      approval: allow
    - match: "deno test *"
      approval: allow
    - match: "node --test *"
      approval: allow
    # Lockfile-exact installs. The dependency graph is already decided, so nothing new is resolved.
    - match: "npm ci"
      approval: allow
    - match: "pnpm install --frozen-lockfile"
      approval: allow
    - match: "yarn install --immutable"
      approval: allow
    - match: "bun install --frozen-lockfile"
      approval: allow
    # Read-only inspection of the dependency tree.
    - match: "npm ls *"
      approval: allow
    - match: "npm why *"
      approval: allow
    - match: "npm view *"
      approval: allow
    - match: "npm outdated *"
      approval: allow
    - match: "npm pack --dry-run *"
      approval: allow
    - match: "pnpm list *"
      approval: allow
    - match: "pnpm why *"
      approval: allow
    - match: "pnpm outdated *"
      approval: allow
    - match: "yarn workspaces list *"
      approval: allow
    - match: "yarn info *"
      approval: allow
    - match: "bun pm ls *"
      approval: allow
    - match: "deno info *"
      approval: allow
    - match: "npm audit"
      approval: allow
    - match: "node --version"
      approval: allow
    # Type checking, linting and formatting. They read the tree and at most rewrite formatting.
    - match: "tsc *"
      approval: allow
    - match: "tsgo *"
      approval: allow
    - match: "oxlint *"
      approval: allow
    - match: "biome check *"
      approval: allow
